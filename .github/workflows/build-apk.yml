name: Build Android app

# Builds an APK you can install on your own phone. Free on public repositories.
# Download it from the run's "Artifacts" section.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  # Also build on pull requests, so a change that breaks the Android build is caught before merging.
  pull_request:
    paths: ["app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: easy-gst-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
